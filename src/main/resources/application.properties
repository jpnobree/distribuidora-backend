spring.application.name=distribuidora-backend

# --- Banco de dados (PostgreSQL) ---
# Ajuste host/porta/nome do banco/usuario/senha para os do seu Postgres.
spring.datasource.url=jdbc:postgresql://localhost:5432/Distribuidora
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# --- Upload de imagens ---
# Arquivos enviados pelo ADMIN ficam salvos em ./uploads (fora do controle
# de versao) e sao servidos em /uploads/**.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- JWT ---
# Troque este segredo antes de colocar em producao (use uma string aleatoria
# longa, por exemplo gerada com `openssl rand -base64 48`).
app.jwt.secret=troque-esta-chave-secreta-por-uma-bem-grande-e-aleatoria-antes-de-ir-para-producao
app.jwt.expiration-minutes=120

# --- Usuarios iniciais (criados automaticamente na primeira execucao) ---
app.seed.admin-username=admin
app.seed.admin-password=admin123
app.seed.demo-username=cliente
app.seed.demo-password=cliente123
