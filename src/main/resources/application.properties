spring.application.name=distribuidora-backend

# --- Banco de dados (PostgreSQL) ---
# Os valores depois de ":" sao o padrao para desenvolvimento local. Em
# producao, defina as variaveis de ambiente (DB_URL, DB_USERNAME, DB_PASSWORD)
# em vez de editar este arquivo - ver application-prod.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Distribuidora}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway (ver src/main/resources/db/migration) e quem cria/atualiza as
# tabelas agora. O Hibernate so confere se as entidades batem com o schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# --- Upload de imagens ---
# Arquivos enviados pelo ADMIN ficam salvos em ./uploads (fora do controle
# de versao) e sao servidos em /uploads/**.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- JWT ---
# Em producao, defina JWT_SECRET (string aleatoria longa, ex: `openssl rand
# -base64 48`). O valor abaixo so vale para desenvolvimento local.
app.jwt.secret=${JWT_SECRET:troque-esta-chave-secreta-por-uma-bem-grande-e-aleatoria-antes-de-ir-para-producao}
app.jwt.expiration-minutes=120

# --- Usuarios iniciais (criados automaticamente na primeira execucao) ---
app.seed.admin-username=${ADMIN_SEED_USERNAME:admin}
app.seed.admin-password=${ADMIN_SEED_PASSWORD:admin123}
app.seed.demo-username=${DEMO_SEED_USERNAME:cliente}
app.seed.demo-password=${DEMO_SEED_PASSWORD:cliente123}

# --- Cache do catalogo publico (Caffeine) ---
# Invalidado automaticamente em qualquer create/update/delete de produto
# (ver @CacheEvict no ProductService); isto aqui e so um limite de seguranca.
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# --- Rate limit do login (ver LoginRateLimitFilter) ---
app.rate-limit.login.capacity=5
app.rate-limit.login.refill-minutes=1

# --- Documentacao da API (springdoc) ---
# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# --- CORS ---
# Origens do front-end autorizadas a chamar a API, separadas por virgula.
# Em producao, defina CORS_ALLOWED_ORIGINS (ex: https://realfrios.vercel.app).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,https://realfrios.vercel.app,https://distribuidora-frontend-zeta.vercel.app}
