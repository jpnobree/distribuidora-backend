# Perfil de producao - ativado com --spring.profiles.active=prod (ou
# SPRING_PROFILES_ACTIVE=prod). Sem valores padrao de propositos: se uma
# variavel de ambiente obrigatoria nao estiver definida, a aplicacao falha
# ao subir em vez de usar silenciosamente um segredo de desenvolvimento.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.seed.admin-username=${ADMIN_SEED_USERNAME}
app.seed.admin-password=${ADMIN_SEED_PASSWORD}
app.seed.demo-username=${DEMO_SEED_USERNAME}
app.seed.demo-password=${DEMO_SEED_PASSWORD}

spring.jpa.show-sql=false
