services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: distribuidora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/distribuidora
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: troque-esta-chave-secreta-por-uma-bem-grande-e-aleatoria-antes-de-ir-para-producao
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
